<!doctype html>
<html lang="nl">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />

  <!-- Primary SEO -->
  <!-- title/description/canonical/og:*/twitter:* worden per pagina gezet door
       react-helmet-async (zie src/Pages/**). react-helmet-async verwijdert
       geen bestaande statische tags, dus deze mogen hier NIET ook staan
       (anders krijgt elke pagina twee <title>/canonical/og-tags). Deze
       index.html wordt door scripts/prerender.mjs per route overschreven
       met de volledig gerenderde, pagina-specifieke HTML. -->
  <meta name="keywords" content="Villa Vredestein, Driebergen, Utrechtse Heuvelrug, historische villa, wonen, restauratie, Manon Keeman, Driebergen-Rijsenburg, pension 1906, studentenhuis" />
  <meta name="author" content="Manon Keeman & Maxim" />
  <meta name="google-site-verification" content="Y3k_uiM48c2TJEsFtfqZldlB8ARHRTtNDGXe8Jsn9m8" />

  <!-- GEO targeting -->
  <meta name="geo.region" content="NL-UT" />
  <meta name="geo.placename" content="Driebergen-Rijsenburg" />
  <meta name="geo.position" content="52.04312;5.28701" />
  <meta name="ICBM" content="52.04312, 5.28701" />

  <!-- Preconnect for performance -->
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />

  <!-- Favicon & Apple icons -->
  <link rel="icon" type="image/png" sizes="512x512" href="/icons/icon-512x512.png" />
  <link rel="icon" type="image/png" sizes="192x192" href="/icons/icon-192x192.png" />
  <link rel="icon" type="image/png" sizes="32x32" href="/icons/icon-96x96.png" />
  <link rel="icon" type="image/png" sizes="16x16" href="/icons/icon-72x72.png" />
  <link rel="apple-touch-icon" sizes="180x180" href="/icons/icon-180x180.png" />
  <link rel="apple-touch-icon" sizes="152x152" href="/icons/icon-152x152.png" />
  <link rel="apple-touch-icon" sizes="144x144" href="/icons/icon-144x144.png" />
  <link rel="apple-touch-icon" sizes="128x128" href="/icons/icon-128x128.png" />

  <!-- Fonts -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600;700&display=swap" />

  <!-- Structured Data -->
  <script type="application/ld+json">
  {
    "@context": "https://schema.org",
    "@graph": [
      {
        "@type": ["LodgingBusiness", "TouristAttraction"],
        "@id": "https://villavredestein.com/#business",
        "name": "Villa Vredestein",
        "alternateName": "Rustoord Vredestein",
        "description": "Historische villa uit 1906 aan de Hoofdstraat in Driebergen-Rijsenburg. Gebouwd door burgemeester Baltus Koker, gerenoveerd door Manon Keeman en Maxim Staal. Verblijf en verhuur in een bijzonder pand op de Utrechtse Heuvelrug.",
        "url": "https://villavredestein.com",
        "logo": {
          "@type": "ImageObject",
          "url": "https://villavredestein.com/VVLogo.png",
          "width": 512,
          "height": 512
        },
        "image": {
          "@type": "ImageObject",
          "url": "https://villavredestein.com/og-image.jpg",
          "width": 1200,
          "height": 630
        },
        "telephone": "+31625015299",
        "email": "villavredestein@gmail.com",
        "address": {
          "@type": "PostalAddress",
          "streetAddress": "Hoofdstraat 147",
          "addressLocality": "Driebergen-Rijsenburg",
          "postalCode": "3975 ED",
          "addressRegion": "Utrecht",
          "addressCountry": "NL"
        },
        "geo": {
          "@type": "GeoCoordinates",
          "latitude": 52.04312,
          "longitude": 5.28701
        },
        "hasMap": "https://maps.google.com/?q=Hoofdstraat+147+Driebergen-Rijsenburg",
        "sameAs": ["https://www.instagram.com/villa.vredestein"],
        "priceRange": "Op aanvraag",
        "numberOfRooms": 6,
        "amenityFeature": [
          { "@type": "LocationFeatureSpecification", "name": "Tuin", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Gedeelde woonkamer", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Historisch pand", "value": true },
          { "@type": "LocationFeatureSpecification", "name": "Beschikbaar als decor voor fotoproducties", "value": true }
        ],
        "founder": { "@type": "Person", "name": "Baltus Koker" },
        "employee": [
          { "@type": "Person", "name": "Manon Keeman" },
          { "@type": "Person", "name": "Maxim Staal" }
        ]
      },
      {
        "@type": "WebSite",
        "@id": "https://villavredestein.com/#website",
        "url": "https://villavredestein.com",
        "name": "Villa Vredestein",
        "description": "Historische villa uit 1906 in Driebergen-Rijsenburg.",
        "inLanguage": ["nl", "en", "fr", "de", "es", "it"],
        "about": { "@id": "https://villavredestein.com/#business" }
      },
      {
        "@type": "BreadcrumbList",
        "itemListElement": [
          { "@type": "ListItem", "position": 1, "name": "Home", "item": "https://villavredestein.com/" },
          { "@type": "ListItem", "position": 2, "name": "Tijdlijn", "item": "https://villavredestein.com/tijdlijn" },
          { "@type": "ListItem", "position": 3, "name": "Galerij", "item": "https://villavredestein.com/galerij" },
          { "@type": "ListItem", "position": 4, "name": "Omgeving", "item": "https://villavredestein.com/omgeving" },
          { "@type": "ListItem", "position": 5, "name": "Verblijven en verhuur", "item": "https://villavredestein.com/verblijven" },
          { "@type": "ListItem", "position": 6, "name": "Over ons", "item": "https://villavredestein.com/verhaal" },
          { "@type": "ListItem", "position": 7, "name": "In de pers", "item": "https://villavredestein.com/in-de-pers" },
          { "@type": "ListItem", "position": 8, "name": "Contact", "item": "https://villavredestein.com/contact" }
        ]
      }
    ]
  }
  </script>
</head>
<body>
<div id="root"></div>

<script type="module" src="/src/main.jsx"></script>

<!-- Netlify form detectie: bot leest statische HTML, niet React bundles -->
<form name="contact" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="naam" />
  <input type="email" name="email" />
  <input type="text" name="subject" />
  <textarea name="bericht"></textarea>
</form>
<form name="verblijven" netlify netlify-honeypot="bot-field" hidden>
  <input type="text" name="naam" />
  <input type="email" name="email" />
  <input type="tel" name="telefoon" />
  <input type="date" name="aankomst" />
  <input type="date" name="vertrek" />
  <select name="gasten"></select>
  <select name="optie"></select>
  <textarea name="bericht"></textarea>
</form>
</body>
</html>
